name: CI Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify compilation of all Python files
        run: |
          python -m py_compile agent.py tools.py cli.py main.py test_suite.py
          python -m py_compile examples/calculator.py examples/todo.py examples/even_numbers.py examples/buggy.py examples/notes.py

      - name: Run unit tests
        run: |
          python -m unittest test_suite.py
